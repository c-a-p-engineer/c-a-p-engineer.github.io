name: Validate sitemap alias

on:
  push:
    branches: [fix/sitemap-xml-alias]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:content
      - run: npm run build
      - name: Verify sitemap alias
        run: |
          test -f dist/sitemap.xml
          cmp -s dist/sitemap.xml dist/sitemap-index.xml
          grep -F "Sitemap: https://c-a-p-engineer.github.io/sitemap.xml" dist/robots.txt
