name: Temporary social entry verification

on:
  push:
    branches: [feat/social-entry-ai-cta-20260911]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:content
      - run: npm run build
      - name: Verify social entry header output
        run: |
          page=dist/ai-agent-skill-router-yaml/index.html
          test -f "$page"
          grep -q "読了目安 約" "$page"
          grep -q "AIで先に要点を見る" "$page"
          grep -q "この記事をAIで解説" "$page"
          grep -q "AIエージェントへ大量のルールを常時読み込ませる代わりに" "$page"
          test "$(grep -o 'data-ai-explain-root' "$page" | wc -l)" -eq 2
