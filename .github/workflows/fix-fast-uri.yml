name: Fix fast-uri security advisory

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-fast-uri.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update fast-uri in lockfile
        run: npm update fast-uri --package-lock-only --ignore-scripts
      - name: Verify patched version
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/fast-uri']?.version;
          if (!version) throw new Error('fast-uri not found in package-lock.json');
          const [major, minor, patch] = version.split('.').map(Number);
          const safe = major > 3 || (major === 3 && (minor > 1 || (minor === 1 && patch >= 6)));
          if (!safe) throw new Error(`fast-uri is still vulnerable: ${version}`);
          console.log(`fast-uri patched version: ${version}`);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit lockfile fix
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: update fast-uri to patched version'
          git push origin HEAD:master
