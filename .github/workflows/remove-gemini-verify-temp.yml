name: Temporary Gemini CTA removal verification

on:
  push:
    branches: [fix/remove-gemini-ai-cta-20260911]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:content
      - run: npm run build
      - name: Verify ChatGPT-only article CTA
        run: |
          page=dist/ai-agent-skill-router-yaml/index.html
          test -f "$page"
          grep -q "ChatGPTで解説" "$page"
          grep -q "AIで先に要点を見る" "$page"
          ! grep -q "gemini.google.com/app" "$page"
          ! grep -q "Geminiで解説" "$page"
