name: Temporary AI discoverability verification

on:
  push:
    branches: [feat/ai-discoverability-v1-20260911]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-discoverability-v1-20260911
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:content
      - run: npm run build
      - name: Verify AI discovery artifacts
        run: |
          test -f dist/llms.txt
          test -f dist/rss.xml
          test -f dist/atom.xml
          test -f dist/php-rss.md
          grep -q "# Copy & Paste Engineer" dist/llms.txt
          grep -q "Canonical: https://c-a-p-engineer.github.io/php-rss/" dist/php-rss.md
          grep -q "application/rss+xml" dist/php-rss/index.html
          grep -q "text/markdown" dist/php-rss/index.html
          ! grep -q "php-rss.md" dist/sitemap-0.xml
          ! grep -q "llms.txt" dist/sitemap-0.xml
          ! grep -q "rss.xml" dist/sitemap-0.xml
          ! grep -q "atom.xml" dist/sitemap-0.xml
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/ai-discoverability-verify-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ai-discoverability-verify-temp.yml
          git commit -m "chore: remove temporary AI discoverability verifier"
          git push origin HEAD:feat/ai-discoverability-v1-20260911
